name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: seedguard          # tests import the package by this folder name
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: cd seedguard && pytest -q

  hermes-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: seedguard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest hermes-agent
      - name: In-process integration + real `hermes chat` end-to-end
        run: cd seedguard && SEEDGUARD_E2E=1 pytest -q
